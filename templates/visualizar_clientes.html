<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-dark fw-bold">Listagem de Clientes</h1>
            <a href="{{ url_for('listar_dados') }}" class="btn btn-outline-dark btn-sm">← Voltar</a>
        </div>

        <!-- Clientes -->
        <div class="card shadow-sm mb-4">

            <!-- Bloco de Título -->
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h2 class="h5 mb-0">Clientes</h2>

                <!-- Botões - Bloco de Título -->
                <div class="d-flex align-items-center gap-2">

                    <div class="d-flex flex-column">
                        <label class="form-label text-white fw-bold mb-1" style="font-size: 0.8rem;">Ordenar por:</label>

                        <!-- Dropdown - Ordenar por -->
                        <div class="dropdown">
                            <button class="btn btn-sm btn-primary dropdown-toggle d-flex justify-content-between align-items-center w-100" type="button" id="btnDropdownClientes" data-bs-toggle="dropdown" aria-expanded="false" style="min-width: 100px; text-align: left;">
                                ID
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="btnDropdownClientes">
                                <li><a class="dropdown-item" href="#" onclick="ordenarClientes('id')">ID</a></li>
                                <li><a class="dropdown-item" href="#" onclick="ordenarClientes('nome')">Cliente</a></li>
                            </ul>
                        </div>
                    </div>

                    <!-- Button Toggle - Crescente/Decrescente -->
                    <div class="d-flex flex-column">
                        <label class="form-label text-white fw-bold mb-1" style="font-size: 0.8rem;">Sentido:</label>

                        <!-- Botão -->
                        <div class="btn-group btn-group-sm" role="group" aria-label="Basic radio toggle button group">

                            <input type="radio" class="btn-check" name="ordem_cliente" id="cliente_crescente" autocomplete="off" checked>
                            <label class="btn btn-outline-primary" for="cliente_crescente">Crescente</label>

                            <input type="radio" class="btn-check" name="ordem_cliente" id="cliente_decrescente" autocomplete="off">
                            <label class="btn btn-outline-primary" for="cliente_decrescente">Decrescente</label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Tabela de Exibição -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle" style="border: 1px solid black;">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cliente in clientes %}
                            <tr>
                                <td>{{ cliente.id_cliente }}</td>
                                <td>{{ cliente.nome_cliente }}</td>
                                <td>{{ cliente.email }}</td>
                                <td>{{ cliente.telefone }}</td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted py-3">Nenhum cliente registado.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



    <!-- Script do Bootstrap sem restrições de integridade -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const direcao = urlParams.get('direcaoCli');
            const campo = urlParams.get('ordenarCli');

            if (direcao === 'desc') {
                document.getElementById('cliente_decrescente').checked = true;
            } else {
                document.getElementById('cliente_crescente').checked = true; // ou crescente por defeito
            }

            const btnDropdown = document.getElementById('btnDropdownClientes');

            if (campo === 'nome') {
                btnDropdown.textContent = 'Cliente';
            } else if (campo === 'id') {
                btnDropdown.textContent = 'ID';
            }
        });

        function ordenarClientes(campo) {
            const decrescente = document.getElementById('cliente_decrescente').checked;
            const direcao = decrescente ? 'desc' : 'asc'

            window.location.href = "{{ url_for('listar_clientes') }}?ordenarCli=" + campo + "&direcaoCli=" + direcao;
        }

        document.getElementById('cliente_crescente').addEventListener('change', aplicarOrdemAtual);
        document.getElementById('cliente_decrescente').addEventListener('change', aplicarOrdemAtual);

        function aplicarOrdemAtual() {
            const urlParams = new URLSearchParams(window.location.search);
            const campoAtual = urlParams.get('ordenarCli') || 'id';

            ordenarClientes(campoAtual);
        }
    </script>
</body>
</html>
