<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

    <style>
    /* Força a caixa a manter-se sempre numa única linha, mesmo quando clicada */
    .ts-control {
        flex-wrap: nowrap !important;
        overflow: hidden !important;
    }
    .ts-wrapper.single .ts-control .item {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .ts-control input {
        min-width: 10px !important;
    }
    </style>

</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 700px;">

        <!-- Botão de Voltar ao Início -->
        <div class="mb-3">
            <a href="{{ url_for('registro_dados') }}" class="btn btn-outline-dark btn-sm">← Voltar</a>
        </div>

        <!-- Container Corpo -->
        <div class="card shadow-sm">

            <!-- Bloco de Título -->
            <div class="card-header bg-dark text-white">
                <h1 class="h5 mb-0">Registrar Venda</h1>
            </div>

            <!-- Corpo -->
            <div class="card-body p-4">

                <!-- Alerta -->
                {% if erro %}
                <div class="alert alert-danger" role="alert">
                    {{ erro }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('registrar_venda') }}">

                    <!-- Selecionar Cliente -->
                    <div class="mb-3">
                        <label for="idClienteForm" class="form-label fw-bold">Cliente:</label>
                        <select class="form-select" name="idClienteForm" id="idClienteForm" required>
                            <option value="" disabled selected>Selecione um cliente...</option>
                            {% for cliente in clientes %}
                                <option value="{{ cliente.id_cliente }}">ID: {{ cliente.id_cliente }} - {{ cliente.nome_cliente }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <hr class="my-4">

                    <label for="idProdutoForm" class="form-label fw-bold">Produtos do Pedido:</label>

                    <!-- Selecionar Produto -->
                    <div id="lista_produtos">
                        <div class="row g-2 mb-3 produto-linha align-items-end">
                            <div class="col-md-6">
                                <select class="form-select produto-select" name="idProdutoForm[]" required onchange="mudancaProduto()">
                                    <option value="" disabled selected data-preco="0">Selecione o produto...</option>
                                    {% for produto in produtos %}
                                        <option value="{{ produto.id_produto }}" data-preco="{{ produto.preco_produto }}">
                                            {{ produto.nome_produto }} (Estoque: {{ produto.estoque }}) | R$ {{ "%.2f"|format(produto.preco_produto) }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Quantidade do Produto -->
                            <div class="col-md-3">
                                <input type="number" step="1" min="1" class="form-control quantidade-input" name="quantidadeForm[]" placeholder="Qtd." required oninput="atualizarTotais()">
                            </div>

                            <!-- Total da Compra -->
                            <div class="col-md-2 text-center">
                                <span class="text-muted small" style="font-size: 11px;">Total:</span>
                                <div><strong class="subtotal-item" style="font-size: 13px;">R$ 0.00</strong></div>
                            </div>

                            <!-- Botão de remover linha (inativo na primeira linha padrão) -->
                            <div class="col-md-1">
                                <button type="button" class="btn btn-outline-danger w-100" onclick="removerLinha(this)" style="display none">X</button>
                            </div>
                        </div>
                    </div>

                    <!-- Botão - Adicionar outro produto -->
                    <div class="mb-4">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="add-produto-btn">+ Adicionar outro produto</button>
                    </div>

                    <hr class="my-4">

                    <div class="alert alert-secondary d-flex justify-content-between align-items-center py-3 mb-4">
                        <span class="fs-5 fw-bold">Soma Total da Venda: </span>
                        <span id="soma-total-geral" class="fs-5 fw-bold text-success">R$ 0.00</span>
                    </div>

                    <!-- Detalhes da Venda -->
                    <div class="mb-3">
                        <label for="detalhesForm" class="form-label fw-bold">Detalhes / Observações:</label>
                        <textarea class="form-control" id="detalhesForm" name="detalhesForm" rows="2" placeholder="Observações sobre a venda..."></textarea>
                    </div>

                    <!-- Data da Venda -->
                    <div class="mb-3">
                        <label for="dataVendaForm" class="form-label fw-bold">Data da Venda:</label>
                        <input type="date" class="form-control" id="dataVendaForm" name="dataVendaForm" required>
                    </div>

                    <!-- Botão de Registrar -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark">Registrar</button>
                    </div>

                    <!-- Modal do Submit -->
                    <div class="modal fade" id="ModalVenda" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="ModalTitulo">Venda Registrada</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    A venda foi registrada com sucesso e o estoque atualizado!
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <script>
        document.getElementById('dataVendaForm').valueAsDate = new Date();

        // Variável para guardar as instâncias do Tom Select dos produtos
        let selectsProdutos = [];

        // Inicializa o Tom Select no Cliente
        new TomSelect("#idClienteForm", {
            create: false,
            sortField: {
                field: "text",
                direction: "asc"
            }
        });

        // Função para inicializar o Tom Select num elemento de produto específico
        function inicializarTomSelectProduto(elemento) {
            return new TomSelect(elemento, {
                create: false,
                sortField: {
                    field: "text",
                    direction: "asc"
                },
                onChange: function() {
                    atualizarTotais();
                    atualizarOpcoesProdutos();
                }
            });
        }

        // Inicializa na primeira linha de produto ao carregar a página
        document.addEventListener("DOMContentLoaded", function() {
            const primeiroSelect = document.querySelector('.produto-select');
            selectsProdutos.push(inicializarTomSelectProduto(primeiroSelect));
            atualizarBotoesRemover();
        });

        function atualizarTotais() {
            const linhas = document.querySelectorAll('.produto-linha');
            let somaGeral = 0;

            linhas.forEach(linha => {
                const selectProduto = linha.querySelector('.produto-select');
                const inputQtd = linha.querySelector('.quantidade-input');
                const spanSubtotal = linha.querySelector('.subtotal-item');

                // O Tom Select esconde o select original e cria um wrapper,
                // mas podemos ler diretamente do select original se usarmos o value dele
                const valorSelecionado = selectProduto.value;
                let preco = 0;

                if (valorSelecionado) {
                    const opcaoSelecionada = selectProduto.querySelector(`option[value="${valorSelecionado}"]`);
                    if (opcaoSelecionada) {
                        preco = parseFloat(opcaoSelecionada.getAttribute('data-preco')) || 0;
                    }
                }

                const quantidade = parseInt(inputQtd.value) || 0;
                const subtotal = preco * quantidade;
                somaGeral += subtotal;

                spanSubtotal.textContent = `R$ ${subtotal.toFixed(2)}`;
            });

            document.getElementById('soma-total-geral').textContent = `R$ ${somaGeral.toFixed(2)}`;
        }

        // Evita produtos duplicados
        function atualizarOpcoesProdutos() {
            const selects = document.querySelectorAll('.produto-select');
            const selecionados = Array.from(selects).map(s => s.value).filter(v => v !== "");

            selects.forEach(selectAtual => {
                // Se o select estiver gerido pelo Tom Select, usamos a instância dele para atualizar as opções visualmente
                const ts = selectAtual.tomselect;
                if (!ts) return;

                Object.values(ts.options).forEach(opt => {
                    if (opt.value === "") return;

                    if (selecionados.includes(opt.value) && opt.value !== selectAtual.value) {
                        ts.hideOption(opt.value);
                    } else {
                        ts.showOption(opt.value);
                    }
                });
            });
        }

        function atualizarBotoesRemover() {
            const linhas = document.querySelectorAll('.produto-linha');
            linhas.forEach((linha, index) => {
                const botao = linha.querySelector('button');
                if (linhas.length === 1) {
                    botao.style.display = 'none';
                } else {
                    botao.style.display = 'block';
                }
            });
        }

        document.getElementById('add-produto-btn').addEventListener('click', function() {
            const container = document.getElementById('lista_produtos');
            const primeiraLinha = container.querySelector('.produto-linha');

            // Destrói temporariamente o Tom Select da primeira linha antes de clonar (para evitar bugs de clonagem)
            const primeiroSelect = primeiraLinha.querySelector('.produto-select');
            if (primeiroSelect.tomselect) primeiroSelect.tomselect.destroy();

            const novaLinha = primeiraLinha.cloneNode(true);

            // Restaura o Tom Select na primeira linha original
            selectsProdutos[0] = inicializarTomSelectProduto(primeiroSelect);

            // Limpa os valores da nova linha clonada
            const novoSelect = novaLinha.querySelector('.produto-select');
            novoSelect.value = '';
            novaLinha.querySelector('input').value = '';
            novaLinha.querySelector('.subtotal-item').textContent = 'R$ 0.00';

            container.appendChild(novaLinha);

            // Inicializa o Tom Select na nova linha criada
            inicializarTomSelectProduto(novoSelect);

            atualizarBotoesRemover();
            atualizarOpcoesProdutos();
        });

        function removerLinha(botao) {
            const linha = botao.closest('.produto-linha');
            const select = linha.querySelector('.produto-select');

            // Destrói o Tom Select da linha antes de removê-la do DOM
            if (select.tomselect) select.tomselect.destroy();

            linha.remove();
            atualizarTotais();
            atualizarBotoesRemover();
            atualizarOpcoesProdutos();
        }
    </script>

    {% if sucesso %}
    <script>
        var meuModal = new bootstrap.Modal(document.getElementById('ModalVenda'));
        meuModal.show();
    </script>
    {% endif %}
</body>
</html>
